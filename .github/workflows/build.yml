name: Build ColorOS APK

on:
  push:
    tags: [ "*-coloros.*" ]
    branches: [ "coloros" ]
  pull_request:
    branches: [ "coloros" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 23

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install build SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Verify and build release APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebugAndroidTest

      - name: Sign release APK
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found." >&2
            exit 1
          fi

          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "unversioned")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts || echo "0")

          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+)+-coloros\.[0-9]+(-[[:alnum:].+-]+)?$ ]]; then
            echo "This workflow only publishes ColorOS versions." >&2
            exit 1
          fi
          # Keep the channel in internal versions/tags; show ColorOS only once in public names.
          DISPLAY_VERSION=$(printf '%s' "$VERSION_NAME" | sed -E 's/-coloros\.[0-9]+//')

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXPECTED_TAG="${VERSION_CODE}-${VERSION_NAME}"
            if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
              echo "Release tag must be $EXPECTED_TAG, got $GITHUB_REF_NAME." >&2
              exit 1
            fi
            if [ -z "$SIGNING_KEY" ]; then
              echo "A stable release signing key is required for tagged builds." >&2
              exit 1
            fi
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)

          if [ -n "$SIGNING_KEY" ]; then
            OUT_NAME="HuaweiPods-ColorOS-${DISPLAY_VERSION}.apk"
            umask 077
            trap 'rm -f /tmp/huaweipods-release.jks' EXIT
            echo "$SIGNING_KEY" | base64 -d > /tmp/huaweipods-release.jks
            "${BUILD_TOOLS}zipalign" -P 16 -f 4 "$UNSIGNED_APK" "./$OUT_NAME"
            "${BUILD_TOOLS}apksigner" sign \
              --ks /tmp/huaweipods-release.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "./$OUT_NAME"
            "${BUILD_TOOLS}apksigner" verify --verbose "./$OUT_NAME"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            OUT_NAME="HuaweiPods-ColorOS-${DISPLAY_VERSION}-unsigned.apk"
            cp "$UNSIGNED_APK" "./$OUT_NAME"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          RELEASE_NOTES=".github/release-notes/${VERSION_NAME}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ ! -f "$RELEASE_NOTES" ]; then
            echo "Release notes file not found: $RELEASE_NOTES" >&2
            exit 1
          fi
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "release_notes=$RELEASE_NOTES" >> "$GITHUB_OUTPUT"

      # Non-zipped artifact upload supported by GitHub Actions
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ./${{ steps.sign.outputs.apk }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          artifacts: "./${{ steps.sign.outputs.apk }}"
          name: HuaweiPods ColorOS ${{ steps.sign.outputs.display_version }}
          bodyFile: ${{ steps.sign.outputs.release_notes }}
          # ColorOS uses its own channel; repository Latest remains the HyperOS release.
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          makeLatest: false
          allowUpdates: true
          replacesArtifacts: true
